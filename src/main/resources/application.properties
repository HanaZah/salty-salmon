spring.application.name=crm
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=always
spring.sql.init.platform=oracle
spring.sql.init.separator=/

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.docker.compose.readiness.timeout=5m
spring.docker.compose.readiness.wait=always

logging.file.name=logs/crm-app.log
logging.logback.rollingpolicy.max-history=30

spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.region.static=eu-central-1
spring.cloud.aws.s3.endpoint=http://localhost:9000
spring.cloud.aws.s3.path-style-access-enabled=true
app.storage.bucket-name=crm-documents
app.document.max-file-size-bytes=20971520
app.storage.download-url-expiration-seconds=60

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

app.scheduling.cleanup.cron=0 0 2 * * ?
app.scheduling.anniversary-rollover.cron=0 0 1 * * ?
app.scheduling.enabled=true

# ==============================================================
# ASYNC I/O THREAD POOL CONFIGURATION
# ==============================================================
app.async.io-executor.core-pool-size=10
app.async.io-executor.max-pool-size=50
app.async.io-executor.queue-capacity=100
app.async.io-executor.thread-name-prefix=IO-Worker-