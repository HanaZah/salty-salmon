services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: oracle-db-java-project
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PWD}
      - APP_USER=${DB_USERNAME}
      - APP_USER_PASSWORD=${DB_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata

  minio:
    image: minio/minio:latest
    container_name: crm-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # The S3 API port (for BE)
      - "9001:9001" # The Web Console port (for browser)
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_KEY}
    volumes:
      - minio_data:/data
volumes:
  oracle-data:
  minio_data: